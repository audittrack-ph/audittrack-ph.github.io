<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My tasks | AuditTrack</title>
  <meta name="description" content="AuditTrack keeps every audit, document, and finding in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- data-page tells script.js which page this is; data-roles says who may open it -->
<body data-page="tasks" data-roles="Auditor">
  <!-- script.js fills in the header: menu links, notifications, and the signed-in user -->
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-head">
      <div class="wrap">
        <h1 id="greeting">My tasks</h1>
        <p>Your tasks across all audits, plus client fixes waiting for your review.</p>
      </div>
    </div>
    <div class="wrap stack">
      <div class="stats" id="stats"></div>
      <section class="card" id="review-card">
        <div class="card-head"><h2>Fixes waiting for your review</h2><span class="muted">Clients sent proof of their corrective actions</span></div>
        <div class="stack" id="review-list"></div>
      </section>
      <div id="task-groups" class="stack"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year">2026</span> AuditTrack. Every audit, every finding, one place.</p>
      <p>Pitch Perfect: Information Management System &middot; Arellano University ETEEAP</p>
    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <!-- data.js (the database) must load before script.js (the pages) -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
