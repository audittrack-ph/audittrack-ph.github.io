<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | AuditTrack</title>
  <meta name="description" content="AuditTrack keeps every audit, document, and finding in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- data-page tells script.js which page this is; data-roles says who may open it -->
<body data-page="reports" data-roles="Manager">
  <!-- script.js fills in the header: menu links, notifications, and the signed-in user -->
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-head no-print">
      <div class="wrap">
        <h1>Reports</h1>
        <p>Build a report from the live audit data, then download it or save it as PDF.</p>
      </div>
    </div>
    <div class="wrap stack">
      <section class="card no-print">
        <h2>Generate a report</h2>
        <form id="report-form">
          <div class="form-grid">
            <div><label for="r-type">Report</label>
              <select id="r-type" name="type">
                <option>Engagement status</option>
                <option>Findings summary</option>
                <option>Monthly operations</option>
              </select>
            </div>
            <div id="r-eng-wrap"><label for="r-eng">Engagement</label><select id="r-eng" name="eng"></select></div>
          </div>
          <div><button class="btn" type="submit">Generate</button></div>
        </form>
      </section>
      <section class="card report" id="report" hidden></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year">2026</span> AuditTrack. Every audit, every finding, one place.</p>
      <p>Pitch Perfect: Information Management System &middot; Arellano University ETEEAP</p>
    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <!-- data.js (the database) must load before script.js (the pages) -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
