<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AuditTrack</title>
  <meta name="description" content="AuditTrack keeps every audit, document, and finding in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login">
    <div class="card login-card">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">&#10003;</span>AuditTrack</a>
      <div>
        <h1>Sign in</h1>
        <p class="muted">Every audit, every finding, one place.</p>
      </div>

      <!-- The sign-in form. script.js sends you to the right page based on the role you pick. -->
      <form id="login-form">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="ana.reyes@audittrack.ph">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" value="demo1234">
        </div>
        <div>
          <label for="role">Sign in as</label>
          <select id="role" name="role">
            <option value="dashboard.html">Audit Manager</option>
            <option value="audit.html">Auditor</option>
            <option value="portal.html">Client</option>
          </select>
        </div>
        <button class="btn" type="submit">Sign in</button>
      </form>

      <p class="muted" style="margin:0">Or open a demo account:</p>
      <a class="account" href="dashboard.html">
        <span class="avatar">AR</span>
        <span><strong>Ana Reyes</strong> &middot; Audit Manager<br><span class="muted">Sees the dashboard, creates audits, makes reports</span></span>
      </a>
      <a class="account" href="audit.html">
        <span class="avatar">MS</span>
        <span><strong>Marco Santos</strong> &middot; Lead Auditor<br><span class="muted">Works on tasks, logs and verifies findings</span></span>
      </a>
      <a class="account" href="portal.html">
        <span class="avatar">LC</span>
        <span><strong>Liza Cruz</strong> &middot; Client<br><span class="muted">Uploads documents and fixes findings</span></span>
      </a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
